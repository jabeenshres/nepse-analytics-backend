# Rate-limit zones. Include this from the main nginx.conf http block, or drop it
# into /etc/nginx/conf.d/ (conf.d is already inside http {}).
#
# 5 requests per minute per IP for the login endpoint is enough for humans and
# slows down credential stuffing.

limit_req_zone $binary_remote_addr zone=nepse_login:10m rate=5r/m;

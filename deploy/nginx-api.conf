# /etc/nginx/sites-available/api.nepse.raijintech.com
#
# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.nepse.raijintech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.nepse.raijintech.com;

    ssl_certificate     /etc/letsencrypt/live/api.nepse.raijintech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nepse.raijintech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Floorsheet HTML uploads
    client_max_body_size 25m;

    # Compress JSON/JS/CSS. Stock payloads are 3-250 KB and compress ~70-80%.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    # Security headers (Django also sets some; these cover everything Nginx serves)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Throttle the login endpoint only. Requires deploy/nginx-limits.conf.
    location = /api/accounts/token/ {
        limit_req zone=nepse_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same throttle for the admin login form.
    location = /admin/login/ {
        limit_req zone=nepse_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Scrapes run from systemd (manage.py run_daily_scrape), not HTTP.
        # Fail fast instead of holding a gunicorn worker for an hour.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
